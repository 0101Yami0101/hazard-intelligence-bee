<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
// Asks the browser where the visitor is and hands the answer back to the app.
// It speaks Streamlit's component messages directly, so there is nothing to
// build. One answer per instance: the app mounts a fresh one for each press.
(function () {
  var started = false, done = false;
  function send(type, data) {
    var msg = {isStreamlitMessage: true, type: type};
    for (var k in data) msg[k] = data[k];
    window.parent.postMessage(msg, "*");
  }
  function answer(value) {
    if (done) return;
    done = true;
    send("streamlit:setComponentValue", {value: value, dataType: "json"});
  }
  function ask() {
    if (!navigator.geolocation) { answer({state: "unsupported"}); return; }
    // A permission prompt that is closed without an answer calls nothing back,
    // and the app would wait for ever. The first answer wins; this is the last.
    setTimeout(function () { answer({state: "failed"}); }, 45000);
    navigator.geolocation.getCurrentPosition(
      function (p) {
        answer({state: "ok",
                lat: +p.coords.latitude.toFixed(4),
                lon: +p.coords.longitude.toFixed(4)});
      },
      function (err) { answer({state: err.code === 1 ? "denied" : "failed"}); },
      {enableHighAccuracy: false, timeout: 15000, maximumAge: 600000});
  }
  window.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "streamlit:render" || started) return;
    started = true;
    ask();
  });
  send("streamlit:componentReady", {apiVersion: 1});
  send("streamlit:setFrameHeight", {height: 0});
})();
</script>
</body>
</html>
